WAFT:
  FEATURE_ENCODER:
    TYPE: "mnv4"
    ARCH: "mobilenetv4_conv_medium"
    LORA_RANK: null
    LORA_ALPHA: null
  ITERATIVE_MODULE:
    TASK: ['delta', 'delta', 'delta', 'delta']
    PROP_ITER:
      TYPE: "mnv4"
      HIDDEN_DIM: 128
      NUM_UIB_BLOCKS: 4
      RES_LAYERS: 4
    DELTA_ITER:
      TYPE: "mnv4"
      HIDDEN_DIM: 128
      NUM_UIB_BLOCKS: 4
      RES_LAYERS: 4
  MAX_DISP: 800
  LOSS: ['mixlap_40']

DATASETS:
  TRAIN: ("sceneflow", "sanpo_synthetic")
  MUL: (1, 1)
  CROP_SIZE: [320, 240]
  TEST: ("things",)

SOLVER:
  BASE_LR: 1.0e-4
  IMS_PER_BATCH: 4
  MAX_ITER: 50000
  CHECKPOINT_PERIOD: 5000
